[project]
name = "server-transformers"
version = "0.1.0"
description = "Service A: Hugging Face transformers on PyTorch MPS, port 8001"
requires-python = ">=3.12,<3.13"
dependencies = [
    # [serving] pulls in what `transformers serve` needs (fastapi, uvicorn, openai types, ...)
    "transformers[serving]>=5.0",
    "torch>=2.6",            # macOS arm64 wheels on PyPI include the MPS backend
    "accelerate>=1.0",
    # for a small FastAPI fallback wrapper, only needed if `transformers serve` misbehaves with Gemma 3
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[tool.uv]
package = false
# Only resolve/lock for Apple Silicon Macs: that is the only target.
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
